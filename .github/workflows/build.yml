name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Create Flutter project structure
        run: flutter create . --org com.memento.app --project-name memento_mobile --platforms=android

      - name: Restore our custom main.dart
        run: git checkout lib/main.dart || true

      - name: Build APK Release
        run: flutter build apk --release

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Memento Mobile v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          body: 'Свежая сборка Memento Mobile для Android'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
