name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Create Flutter project structure
        run: |
          # Создаем временный проект, чтобы получить рабочие файлы Android и pubspec
          flutter create . --org com.memento.app --project-name memento_mobile --platforms=android

      - name: Restore our custom main.dart
        run: |
          # Убеждаемся, что наш красивый интерфейс на месте (он мог перезаписаться командой выше)
          # Если файл lib/main.dart стерся, git checkout вернет его, либо мы заменяем его содержимое
          git checkout lib/main.dart || true

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: memento-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
